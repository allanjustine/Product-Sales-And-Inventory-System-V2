name: product-sales-and-inventory-system-v2
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: store
    restart: unless-stopped
    ports:
      - "8002:8002"
    env_file:
      - .env
    networks:
      - web
    volumes:
      - uploads:/var/www/html/storage/app/public
networks:
  web:
    external: true
volumes:
  uploads:
